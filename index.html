<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="釜山之旅">
<title>釜山之旅 5天4夜</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone companion. Collapsed stop rows with one quick 導航 button; everything else lives inside the row. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#1c2a33; --muted:#5f707b; --line:#dde5ea;
  --sea:#1f5f8b; --sea-soft:#e3eef6; --pink:#d4537e; --pink-soft:#fbe8ef;
  --move:#b35f12; --move-soft:#fdf0e1; --ok:#2f7d4f; --ok-soft:#e3f2e8; --due:#c0392b; --naver:#03a94d;
  --b-sea:#1f5f8b; --b-pink:#c2416c; --b-move:#a2550f; --b-naver:#03a94d;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f171d; --surface:#17222a; --ink:#e4ecf1; --muted:#93a4ae; --line:#2a3943;
  --sea:#7fb6dc; --sea-soft:#1c3142; --pink:#f08cb0; --pink-soft:#3a1f2b;
  --move:#f0a85a; --move-soft:#3a2a17; --ok:#6fc293; --ok-soft:#173326; --due:#ff7b6b; --naver:#3fd17f;
  --b-sea:#2a6d9c; --b-pink:#b03f66; --b-move:#94531a; --b-naver:#04893f; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1f5f8b}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--sea)}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.hero{background:#1f5f8b;color:#fff;padding-block:16px 14px}
.hero .wrap{display:flex;align-items:center;gap:12px}
.hero .ttl{flex:1;min-width:0}
.hero h1{font-family:var(--f-display);font-size:1.6rem;line-height:1.2;margin:0}
.hero p{margin:2px 0 0;opacity:.85;font-size:.82rem}
.hbtn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:.68rem;font-weight:700;cursor:pointer;line-height:1.1;gap:2px}
.hbtn b{font-size:1.15rem}
.hero h1{white-space:nowrap}
.hbtn.sos{background:#c0392b}
.next .acts .act.g{background:var(--b-sea)}

/* tabs */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:5px 11px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;position:relative}
nav.tabs button em{font-style:normal;font-size:.68rem;font-weight:700;white-space:nowrap}
nav.tabs button strong{font-size:.95rem}
nav.tabs button small{font-size:.66rem;font-family:var(--f-mono)}
nav.tabs button[aria-selected="true"]{background:var(--b-sea);color:#fff}
nav.tabs button .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--pink)}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

main{padding-block:14px 64px}
.eyebrow{display:inline-block;font-size:.76rem;font-weight:700;color:var(--pink);background:var(--pink-soft);border-radius:999px;padding:1px 10px}
h2{font-family:var(--f-display);font-size:1.4rem;margin:4px 0 0;line-height:1.3;text-wrap:balance}
.date{color:var(--muted);font-size:.85rem;margin:0 0 10px}
h3{font-size:.95rem;margin:22px 0 8px;color:var(--muted);letter-spacing:.04em}

/* next stop */
.next{background:var(--surface);border:2px solid var(--sea);border-radius:16px;padding:12px 14px;margin:6px 0 14px}
.next .lbl{font-size:.75rem;font-weight:700;color:var(--sea);letter-spacing:.06em}
.next .nt{font-size:1.15rem;font-weight:700;line-height:1.35;margin:2px 0}
.next .nt .tm{font-family:var(--f-mono);font-size:.95rem;color:var(--muted);margin-right:6px}
.next .due{font-size:.86rem;color:var(--due);font-weight:700;margin-top:4px}
.next.done{border-color:var(--ok)}
.next.done .lbl{color:var(--ok)}

/* stay strip */
.stay{display:flex;align-items:center;gap:8px;background:var(--sea-soft);border-radius:12px;padding:8px 10px 8px 12px;margin-bottom:8px;font-size:.88rem}
.stay span{flex:1;min-width:0}
.flow{font-size:.84rem;color:var(--muted);padding:2px 2px 0}
.tools{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;font-size:.78rem;color:var(--muted)}
.tools button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.78rem}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:calc(3.2em + 19px);top:10px;bottom:10px;width:2px;background:var(--line)}
.stop{display:grid;grid-template-columns:3.2em 32px minmax(0,1fr);column-gap:4px;align-items:start;padding-block:9px;position:relative}
.stop .time{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);text-align:right;padding-top:5px;font-variant-numeric:tabular-nums;word-break:keep-all}
.stop.due .time{color:var(--due);font-weight:700}
.chk{width:32px;height:32px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;padding:0;position:relative;z-index:1}
.chk i{width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--sea);display:grid;place-items:center}
.food .chk i{border-color:var(--pink)}
.move .chk i{border-color:var(--move)}
.stop.is-done .chk i{background:var(--ok);border-color:var(--ok)}
.stop.is-done .chk i::after{content:"";width:5px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.stop.is-done .sd>summary,.stop.is-done .plain{opacity:.5}
.stop.is-done .title{text-decoration:line-through;text-decoration-color:var(--muted)}
.stop.is-next .title{color:var(--sea)}
.sd>summary{list-style:none;cursor:pointer;position:relative;padding:2px 84px 2px 2px;border-radius:8px;min-height:48px}
.stop.no-q .sd>summary{padding-right:26px}
.sd>summary::-webkit-details-marker{display:none}
.sd>summary::after{content:"";position:absolute;right:66px;top:10px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.sd[open]>summary::after{transform:rotate(-135deg);top:14px}
.plain{padding:2px 2px 2px 2px}
.stop.no-q .sd>summary::after{right:6px}
.kind{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.05em;padding:0 6px;border-radius:4px;background:var(--sea-soft);color:var(--sea);vertical-align:2px}
.food .kind{background:var(--pink-soft);color:var(--pink)}
.move .kind{background:var(--move-soft);color:var(--move)}
.badge{display:inline-block;font-size:.66rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:2px}
.badge.warn{color:var(--due);border-color:currentColor}
.title{font-weight:700;font-size:1.02rem;line-height:1.4}
.sub{color:var(--muted);font-size:.85rem;line-height:1.5}
.qnav{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:54px;height:48px;border-radius:12px;background:var(--b-sea);color:#fff;text-decoration:none;font-size:.7rem;font-weight:700;gap:1px;white-space:nowrap}
.stop>.qnav{position:absolute;right:0;top:9px}
.food .qnav{background:var(--b-pink)}
.move .qnav{background:var(--b-move)}
.qnav svg{width:18px;height:18px}
.sdc{padding:4px 2px 6px;margin-left:calc(-3.2em - 36px);position:relative;z-index:1;background:var(--bg)}

/* inside a stop */
.photos{display:grid;gap:6px;margin-top:8px}
.photos.two{grid-template-columns:1fr 1fr}
.photos img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--sea-soft)}
.photos:not(.two) img{aspect-ratio:16/10}
.mapimg{display:block;width:100%;aspect-ratio:16/10;border:0;border-radius:12px;margin-top:8px;background:var(--sea-soft)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.acts .act.d{grid-column:1/-1}
@media (min-width:560px){.acts{grid-template-columns:1fr 1fr 1fr}.acts .act.d{grid-column:auto}}
.act{display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;border-radius:12px;text-decoration:none;font-weight:700;font-size:.85rem;border:0;cursor:pointer;padding:0 8px;white-space:nowrap}
.act svg{width:16px;height:16px;flex:0 0 auto}
.act.g{background:var(--b-sea);color:#fff}
.act.n{background:var(--b-naver);color:#fff}
.act.d{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:.82rem}
.links a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:28px}
.links a svg{width:14px;height:14px}
.tip{margin-top:8px;font-size:.84rem;background:var(--move-soft);border-radius:10px;padding:8px 10px}
.tip b{color:var(--move)}
.warn{margin-top:8px;font-size:.84rem;border-left:3px solid var(--due);padding:2px 10px}
.alts{display:grid;gap:8px;margin-top:10px}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.alt .an{font-weight:700}
.alt .an small{font-weight:400;color:var(--muted);display:block;font-size:.8rem}
.alt .act{min-height:40px;font-size:.8rem}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:.86rem}

/* info tab */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card .title{font-size:1rem}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.78rem}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lk{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.88rem;min-width:0}
.lk svg{width:16px;height:16px;flex:0 0 auto;color:var(--muted)}
.check{list-style:none;padding:0;margin:0}
.check label{display:flex;gap:10px;align-items:flex-start;padding:6px 2px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ok);flex:0 0 auto;margin-top:2px}
.check input:checked+span{text-decoration:line-through;color:var(--muted)}
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
details.grp>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"＋";color:var(--muted)}
details.grp[open]>summary::after{content:"－"}
details.grp .inner{padding:0 14px 12px}
.place{padding:10px 0;border-top:1px solid var(--line)}
.place:first-child{border-top:0}
.place .meta{font-size:.82rem;color:var(--muted)}
.switch{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.switch+.switch{border-top:1px solid var(--line)}
.switch input{width:46px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;transition:background .15s;flex:0 0 auto}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{left:23px}
body.no-photos .photos{display:none}
body.no-maps .mapimg{display:none}

/* sheets */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,20,28,.45)}
.sheet .pane{background:var(--surface);color:var(--ink);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:90vh;overflow:auto}
.sheet h4{margin:0 0 10px;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.driver .pane{border-radius:0;max-height:none;height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.driver .ko{font-size:clamp(2rem,9vw,3.4rem);font-weight:700;line-height:1.25;word-break:keep-all;user-select:text}
.driver .addr{font-size:clamp(1.15rem,5vw,1.6rem);font-weight:500;line-height:1.4;word-break:keep-all;user-select:text;background:var(--sea-soft);border-radius:12px;padding:10px 14px}
.driver .addr.none{font-size:.95rem;color:var(--muted);background:transparent}
.driver .zh{font-size:1.05rem;color:var(--muted)}
.driver .say{font-size:1.5rem;font-weight:700;color:var(--sea)}
.driver .say small{display:block;font-size:.85rem;color:var(--muted);font-weight:400}
.driver .acts .act.d{grid-column:auto}
.driver .acts{grid-template-columns:1fr 1fr;max-width:420px;margin:10px auto 0;width:100%}
.cv label{display:block;font-size:.8rem;color:var(--muted);margin-top:10px}
.cv input{width:100%;font:inherit;font-size:1.6rem;font-family:var(--f-mono);padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.cv .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cv .chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:var(--f-mono);font-size:.85rem}
.cv .rate{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.82rem;color:var(--muted)}
.cv .rate input{font-size:.9rem;width:110px;padding:5px 8px}
.sos a.call{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);margin-bottom:8px}
.sos a.call b{font-family:var(--f-mono);font-size:1.05rem;color:var(--due);white-space:nowrap}
.sos a.call span small{display:block;color:var(--muted);font-size:.78rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:30}


.wx{display:inline-flex;flex-wrap:wrap;gap:2px 10px;margin-left:10px;font-size:.8rem;color:var(--muted)}
.hrs{display:inline-block;font-size:.66rem;font-weight:700;border-radius:4px;padding:0 6px;margin-left:4px;vertical-align:2px}
.hrs.on{background:var(--ok-soft);color:var(--ok)}
.hrs.soon{background:var(--move-soft);color:var(--move)}
.hrs.off{background:var(--line);color:var(--muted)}
.hnote{font-size:.74rem;color:var(--muted);margin-top:6px}
.srch input{width:100%;font:inherit;font-size:1.05rem;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.srch ul{list-style:none;margin:10px 0 0;padding:0;min-height:40vh}
.srch li button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;cursor:pointer}
.srch li button small{display:block;color:var(--muted);font-size:.8rem}
.srch li.hint{color:var(--muted);font-size:.88rem;padding:10px 4px}
.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,40%{background:var(--pink-soft)}100%{background:transparent}}
.hbtn{width:48px;height:48px}

.tcats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tcats button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.tcats button[aria-pressed="true"]{background:var(--b-sea);color:#fff;border-color:transparent}
.addt{width:100%;cursor:pointer}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.tgrid button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;text-align:left}
.tgrid img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.tgrid span{display:block;font-size:.74rem;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgrid .empty{grid-column:1/-1;color:var(--muted);font-size:.88rem;text-align:center;padding:24px 0}
.tview .pane{background:#fff;color:#111;border-radius:0;height:100%;max-height:none;display:flex;flex-direction:column;gap:8px}
.tview .x{background:#eee;color:#111}
.tvh,.tvf{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tview img{flex:1;min-height:0;width:100%;object-fit:contain}
.tview .sub{color:#666}
.tdel{border:1px solid #d33;color:#d33;background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer}
.tdel.arm{background:#d33;color:#fff}
.tixbtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border:1px dashed var(--sea);color:var(--sea);background:transparent;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:.85rem}

.nvhead{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.nvhead b{color:var(--ok)}
.nvlist{list-style:none;margin:0;padding:0}
.nvlist li{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.nvlist label{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.nvlist input{width:20px;height:20px;accent-color:var(--ok);flex:0 0 auto;margin-top:2px}
.nvlist span{min-width:0}
.nvlist small{display:block;color:var(--muted);font-size:.76rem;overflow-wrap:anywhere}
.nvlist input:checked+span b{text-decoration:line-through;color:var(--muted)}
.nvbtn{flex:0 0 auto;background:var(--b-naver);color:#fff;text-decoration:none;font-weight:700;font-size:.8rem;border-radius:10px;padding:8px 10px}
.nvweb{flex:0 0 auto;color:var(--muted);font-size:.74rem;text-decoration:none;padding:8px 2px}
/* ===== motion ===== */
*{-webkit-tap-highlight-color:transparent}
:root{--ease:cubic-bezier(.2,.8,.2,1)}
nav.tabs .wrap{position:relative}
nav.tabs button{z-index:1;transition:color .25s var(--ease)}
nav.tabs button[aria-selected="true"]{background:transparent}
.pill{position:absolute;top:6px;left:0;height:calc(100% - 12px);border-radius:12px;background:var(--b-sea);transition:transform .35s var(--ease),width .35s var(--ease);will-change:transform;z-index:0}
main section{animation:none}
main section.in-r{animation:inR .32s var(--ease)}
main section.in-l{animation:inL .32s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.qnav,.act,.hbtn,.chk,.tools button,.lk,.cv .chips button,.sos a.call,.x{transition:transform .14s var(--ease),filter .14s}

const koOf=q=>KO[q]||q;
const gNav=q=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q);
const gSearch=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const nSearch=q=>'https://map.naver.com/p/search/'+encodeURIComponent(koOf(q).replace(/\s*\(.*?\)\s*/g,' ').trim());
const embed=q=>'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&hl=zh-TW&z=16&output=embed';
const igTag=p=>{if(p.ig!==undefined)return p.ig;const q=p.nav;if(!q)return '';if(q in IGOVR)return IGOVR[q];if(/^[\d.,]+$/.test(q))return '';return q.replace(/[^\p{L}\p{N}]/gu,'')};
const photoHtml=t=>{const p=PHOTOS[t];if(!p)return '';return `<div class="photos${p.length>1?' two':''}">${p.map(f=>`<img loading="lazy" src="${/^https?:/.test(f)?f:PB+f}" alt="${esc(t)}" onerror="this.remove()">`).join('')}</div>`};
const mapHtml=q=>q?`<iframe class="mapimg" loading="lazy" title="地圖" referrerpolicy="no-referrer-when-downgrade" src="${embed(q)}"></iframe>`:'';

/* the three big actions + small links */
function acts(p,name){
  if(!p.nav) return linksHtml(p);
  return `<div class="acts">
    <a class="act g" href="${gNav(p.nav)}" target="_blank" rel="noopener">${ic.nav}Google</a>
    <a class="act n" href="${nSearch(p.nav)}" target="_blank" rel="noopener">${ic.pin}Naver</a>
    <button type="button" class="act d drv" data-ko="${esc(koOf(p.nav))}" data-zh="${esc(name)}" data-q="${esc(p.nav)}" data-addr="${esc(ADDR[p.nav]||'')}">${ic.taxi}給司機看</button>
  </div>`+linksHtml(p);
}
function linksHtml(p){
  const L=[];
  const m=p.map||(p.nav?gSearch(p.nav):null);
  if(m) L.push(`<a href="${m}" target="_blank" rel="noopener">${ic.pin}Google 照片・評論</a>`);
  const tg=igTag(p); if(tg) L.push(`<a href="instagram://tag?name=${encodeURIComponent(tg)}">${ic.ig}IG 照片（開 App）</a>`);
  if(p.link) L.push(`<a href="${p.link[1]}" target="_blank" rel="noopener">${ic.ext}${esc(p.link[0])}</a>`);
  return L.length?`<div class="links">${L.join('')}</div>`:'';
}

const DUE={ /* times you must not miss */
 d1:[['15:00','入住拉昂酒店']],
 d2:[['16:30','天空膠囊列車出發'],['18:30','海岸列車末班']],
 d3:[['05:40','出發去起點'],['07:15','跑到終點'],['11:00','拉昂酒店退房']],
 d4:[['05:25','西面站會合'],['05:36','首班車'],['07:20','跑到終點'],['10:30','韋茜醫美']],
 d5:[['11:00','飯店退房'],['15:00','抵達金海機場'],['18:55','飛機起飛']]
};
const pad=n=>String(n).padStart(2,'0');
const kst=()=>new Date(Date.now()+9*3600e3); /* Korea time, whatever the phone's zone */
const todayStr=()=>{const d=kst();return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const minsOf=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t);return m?+m[1]*60+ +m[2]:null};
const nowMins=()=>{const d=kst();return d.getUTCHours()*60+d.getUTCMinutes()};
const fmtLeft=m=>m>=60?`${Math.floor(m/60)} 小時 ${m%60} 分`:`${m} 分`;


/* opening-hours badge (Korea time). Hours come from the trip notes; Naver has the live hours. */
function hoursOf(t){if(!t||/最適合|首班|末班|QR/.test(t))return null;if(/24\s*小時/.test(t))return {all:1};const m=/(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/.exec(t);return m?{o:+m[1]*60+ +m[2],c:+m[3]*60+ +m[4]}:null}
const hhmm=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
function hrsSpan(t){const h=hoursOf(t);return h?`<span class="hrs" data-h="${h.all?'all':h.o+','+h.c}"></span>`:''}
function paintHours(){
  const n=nowMins(),today=todayStr();
  document.querySelectorAll('.hrs').forEach(el=>{
    const sec=el.closest('section');const d=days.find(x=>'sec-'+x.id===sec.id);
    if(!d||d.date!==today){el.hidden=true;return}
    el.hidden=false;
    if(el.dataset.h==='all'){el.className='hrs on';el.textContent='24h 營業';return}
    let [o,c]=el.dataset.h.split(',').map(Number);if(c<=o)c+=1440;
    let x=n;if(x<o&&x+1440<c)x+=1440;
    if(x>=o&&x<c){const left=c-x;el.className='hrs '+(left<=60?'soon':'on');el.textContent=left<=60?`${left} 分後打烊`:'營業中'}
    else{el.className='hrs off';el.textContent=`已打烊・${hhmm(o)} 開`}
  });
}

const kindLabel={move:'交通',food:'吃',sight:'景點',stay:'住宿',note:'提醒'};
const doneKey=(d,i)=>`done-${d}-${i}`;
const isDone=(d,i)=>store.get(doneKey(d,i),'0')==='1';

function stopHtml(d,s,i){
  const k=s.k==='stay'||s.k==='note'?'sight':s.k;
  const dueTimes=(DUE[d.id]||[]).map(x=>x[0]);
  const isDue=dueTimes.includes(s.t);
  let c='';
  c+=photoHtml(s.title);
  if(s.nav) c+=mapHtml(s.nav);
  c+=acts(s,s.title);
  if(s.alts){c+='<div class="alts">'+s.alts.map(a=>`<div class="alt"><div class="an">${esc(a.n)} ${hrsSpan(a.s)}${a.s?`<small>${esc(a.s)}</small>`:''}</div>${photoHtml(a.n)}${mapHtml(a.nav)}${acts(a,a.n)}</div>`).join('')+'</div>'}
  if(s.tix) c+=`<button type="button" class="tixbtn" data-cat="${s.tix}">🎫 打開${s.tix}票券</button>`;
  if(s.tip) c+=`<div class="tip">${s.tip}</div>`;
  if(s.warn) c+=`<div class="warn">⚠️ ${esc(s.warn)}</div>`;
  if(hoursOf(s.sub)||(s.alts||[]).some(a=>hoursOf(a.s))) c+=`<div class="hnote">營業時間來自筆記，實際以 Naver 地圖為準</div>`;
  const badges=(s.alts?`<span class="badge">${s.alts.length} 選 1</span>`:'')+(s.warn||isDue?`<span class="badge warn">${isDue?'⏰ 準時':'⚠️ 注意'}</span>`:'');
  const head=`<span class="kind">${kindLabel[s.k]}</span>${badges}${s.k==='move'?'':hrsSpan(s.sub)}<div class="title">${esc(s.title)}</div>${s.sub?`<div class="sub">${esc(s.sub)}</div>`:''}`;
  const q=s.nav?`<a class="qnav" href="${gNav(s.nav)}" target="_blank" rel="noopener" aria-label="導航到 ${esc(s.title)}">${ic.nav}導航</a>`:'';
  return `<li class="stop ${k}${s.nav?'':' no-q'}${isDue?' due':''}${isDone(d.id,i)?' is-done':''}" data-d="${d.id}" data-i="${i}">
    <div class="time">${esc(s.t)}</div>
    <button type="button" class="chk" aria-label="標記完成：${esc(s.title)}" aria-pressed="${isDone(d.id,i)}"><i></i></button>
    ${c?`<details class="sd"><summary>${head}</summary><div class="sdc">${c}</div></details>`:`<div class="plain">${head}</div>`}
    ${q}
  </li>`;
}

/* 下一站 card: only on today's tab */
function updateNext(){
  paintHours();
  document.querySelectorAll('.stop.is-next').forEach(e=>e.classList.remove('is-next'));
  for(const d of days){
    const slot=document.querySelector(`#sec-${d.id} .next-slot`);
    if(!slot) continue;
    if(d.date!==todayStr()){slot.innerHTML='';continue}
    const idx=d.stops.findIndex((s,i)=>!isDone(d.id,i)&&s.k!=='note');
    const nm=nowMins();
    const due=(DUE[d.id]||[]).map(([t,l])=>({t,l,left:minsOf(t)-nm})).find(x=>x.left>=0);
    const dueHtml=due?`<div class="due">⏰ ${due.t} ${esc(due.l)}・還有 ${fmtLeft(due.left)}</div>`:'';
    if(idx<0){slot.innerHTML=`<div class="next done"><div class="lbl">今天的行程</div><div class="nt">全部完成，辛苦了 🎉</div>${dueHtml}</div>`;continue}
    const s=d.stops[idx];
    document.querySelector(`.stop[data-d="${d.id}"][data-i="${idx}"]`)?.classList.add('is-next');
    const target=s.nav?s:(s.alts&&s.alts.find(a=>a.nav))||null;
    slot.innerHTML=`<div class="next"><div class="lbl">下一站</div>
      <div class="nt"><span class="tm">${esc(s.t)}</span>${esc(s.title)}</div>
      ${s.alts&&!s.nav?`<div class="sub">${s.alts.length} 個選擇，展開下方行程挑一家</div>`:''}
      ${target?acts({nav:target.nav},target.title||target.n).replace(/<div class="links">.*<\/div>$/s,''):''}
      ${dueHtml}</div>`;
  }
}


/* weather + sunset for Busan (Open-Meteo, no key). Cached so it shows offline. */
const WXC=c=>c===0?['☀️','晴']:c<=2?['🌤','晴時多雲']:c===3?['☁️','陰']:c<=48?['🌫','霧']:c<=57?['🌦','毛毛雨']:c<=67?['🌧','雨']:c<=77?['❄️','雪']:c<=82?['🌦','陣雨']:['⛈','雷雨'];
function paintWx(w){if(!w||!w.daily)return;const D=w.daily;
  document.querySelectorAll('.wx').forEach(el=>{const i=D.time.indexOf(el.dataset.date);if(i<0){el.textContent='';return}
    const [e,t]=WXC(D.weather_code[i]);const ss=(D.sunset[i]||'').slice(11,16);
    el.innerHTML=`<span>${e} ${t} ${Math.round(D.temperature_2m_max[i])}°/${Math.round(D.temperature_2m_min[i])}°</span><span>☔ ${D.precipitation_probability_max[i]??'-'}%</span><span>🌇 日落 ${ss}</span>`})}
function loadWx(){
  try{paintWx(JSON.parse(store.get('wx','null')))}catch(e){}
  fetch('https://api.open-meteo.com/v1/forecast?latitude=35.16&longitude=129.10&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset&timezone=Asia%2FSeoul&start_date=2026-10-21&end_date=2026-10-25')
   .then(r=>r.ok?r.json():null).then(w=>{if(w&&w.daily){store.set('wx',JSON.stringify(w));paintWx(w)}}).catch(()=>{});
}

function naverPlaces(){

  const add=(nav,name,day)=>{if(!nav)return;const ko=koOf(nav).replace(/\s*\(.*?\)\s*/g,' ').trim();if(seen.has(ko)){seen.get(ko).days.add(day);return}seen.set(ko,{ko,name,days:new Set([day])})};
  add(LAON.nav,'拉昂酒店','住宿');add(DENBASTA.nav,'西面登巴斯塔中央酒店','住宿');
  days.forEach(d=>d.stops.forEach(s=>{if(s.k!=='stay')add(s.nav,s.title,d.tab);(s.alts||[]).forEach(a=>add(a.nav,a.n,d.tab))}));
  return [...seen.values()];
}

/* ================= tabs ================= */
const tabsEl=$('#tabs'), mainEl=$('#main');
const all=[{id:'info',area:'出發前',tab:'行前',d:'資訊'},...days.map(d=>({id:d.id,area:d.area,tab:d.tab,d:d.d.split(' ')[0],date:d.date}))];
mainEl.innerHTML=`<section id="sec-info">${renderInfo()}</section>`+days.map(d=>`<section id="sec-${d.id}" hidden>${renderDay(d)}</section>`).join('');
function renderTabs(){
  requestAnimationFrame(movePill);
  tabsEl.innerHTML=all.map(t=>`<button role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="false">${t.date===todayStr()?'<span class="dot" aria-label="今天"></span>':''}<em>${esc(t.area)}</em><strong>${esc(t.tab)}</strong><small>${esc(t.d)}</small></button>`).join('');
}
renderTabs();
let current='info';
function show(id,scroll){
  const from=all.findIndex(a=>a.id===current),to=all.findIndex(a=>a.id===id);
  const changed=id!==current;
  current=id;
  for(const t of all){$('#sec-'+t.id).hidden=t.id!==id;$('#tab-'+t.id).setAttribute('aria-selected',t.id===id)}
  store.set('tab',id);
  const sec=$('#sec-'+id);sec.classList.remove('in-l','in-r');if(changed&&!REDUCE){void sec.offsetWidth;sec.classList.add(to>from?'in-r':'in-l')}
  movePill();
  if(scroll&&window.scrollY>$('header.hero').offsetHeight) window.scrollTo({top:$('header.hero').offsetHeight});
  const tb=$('#tab-'+id);tabsEl.scrollTo({left:tb.offsetLeft-(tabsEl.clientWidth-tb.offsetWidth)/2,behavior:REDUCE?'auto':'smooth'});
  if(id!=='info') jumpToNext(id);
}
function jumpToNext(id){
  const d=days.find(x=>x.id===id); if(!d||d.date!==todayStr()) return;
  const el=document.querySelector(`#sec-${id} .stop.is-next`);
  if(el && el.getBoundingClientRect().top>window.innerHeight) el.scrollIntoView({block:'center',behavior:'smooth'});
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;show(b.dataset.id,true);try{history.replaceState(null,'','#'+b.dataset.id)}catch(err){}});


/* ===== motion helpers ===== */
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateDetails(d,open){
  const c=d.querySelector(':scope>.sdc, :scope>.inner');
  d._target=open;
  if(REDUCE||!c){d.open=open;return}
  if(d._anim) d._anim.cancel();
  if(open){
    d.open=true;
    const h=c.scrollHeight;
    d._anim=c.animate([{height:'0px',opacity:0},{height:h+'px',opacity:1}],{duration:Math.min(420,180+h*.25),easing:'cubic-bezier(.2,.8,.2,1)'});
  }else{
    const h=c.scrollHeight;
    d._anim=c.animate([{height:h+'px',opacity:1},{height:'0px',opacity:0}],{duration:Math.min(320,140+h*.18),easing:'cubic-bezier(.4,0,.2,1)'});
    d._anim.onfinish=()=>{d.open=false};
  }
  const a=d._anim; a.addEventListener('finish',()=>{if(d._anim===a)d._anim=null});
}
document.addEventListener('click',e=>{
  const sm=e.target.closest('details.sd>summary, details.grp>summary');
  if(!sm) return;
  e.preventDefault();
  const d=sm.parentElement;
  animateDetails(d,!(d._target??d.open));
},true);
function movePill(){
  const sel=tabsEl.querySelector('[aria-selected="true"]');let p=tabsEl.querySelector('.pill');
  if(!p){p=document.createElement('span');p.className='pill';tabsEl.prepend(p)}
  if(!sel) return;
  p.style.width=sel.offsetWidth+'px';p.style.transform=`translateX(${sel.offsetLeft}px)`;
}
window.addEventListener('resize',movePill);
/* swipe left/right to change day */
(()=>{let x0=null,y0=0,t0=0;
  mainEl.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,iframe,.tbl')){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now()},{passive:true});
  mainEl.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.8&&Date.now()-t0<600){const i=all.findIndex(a=>a.id===current);const j=i+(dx<0?1:-1);if(j>=0&&j<all.length){show(all[j].id,true);try{history.replaceState(null,'','#'+all[j].id)}catch(err){}}}
  },{passive:true});
})();
/* ================= interactions ================= */
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1600)}
function openSheet(id){const s=$('#'+id);s.hidden=false;document.body.style.overflow='hidden';requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('show')))}
function closeSheets(){document.querySelectorAll('.sheet:not([hidden])').forEach(s=>{s.classList.remove('show');setTimeout(()=>{if(!s.classList.contains('show'))s.hidden=true},REDUCE?0:300)});document.body.style.overflow=''}
document.addEventListener('click',e=>{
  const chk=e.target.closest('.chk');
  if(chk){const li=chk.closest('.stop');const k=doneKey(li.dataset.d,li.dataset.i);const v=!li.classList.contains('is-done');store.set(k,v?'1':'0');li.classList.toggle('is-done',v);chk.setAttribute('aria-pressed',v);chk.classList.remove('pop');if(v){void chk.offsetWidth;chk.classList.add('pop')}if(navigator.vibrate&&v)navigator.vibrate(12);updateNext();if(v)toast('已完成 ✓');return}
  const exp=e.target.closest('.exp');
  if(exp){const o=exp.dataset.open==='1';exp.closest('section').querySelectorAll('details.sd').forEach(d=>{if(d.open!==o)animateDetails(d,o)});return}
  const drv=e.target.closest('.drv');
  if(drv){$('#dr-ko').textContent=drv.dataset.ko;const ad=drv.dataset.addr;$('#dr-addr').textContent=ad||'地址請以 Naver 地圖為準';$('#dr-addr').classList.toggle('none',!ad);$('#dr-zh').textContent=drv.dataset.zh;$('#dr-naver').href=nSearch(drv.dataset.q);document.querySelectorAll('.sheet:not(#sh-driver)').forEach(x=>{x.classList.remove('show');x.hidden=true});openSheet('sh-driver');return}
  const tvw=e.target.closest('#sh-tview');if(tvw&&(e.target.closest('[data-close]')||e.target===tvw)){tvw.classList.remove('show');setTimeout(()=>tvw.hidden=true,250);return}
  if(e.target.closest('[data-close]')||e.target.classList.contains('sheet')){closeSheets();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets()});
$('#open-sos').addEventListener('click',()=>{$('#sos-body').innerHTML=sosHtml();openSheet('sh-sos')});
$('#open-search').addEventListener('click',()=>{openSheet('sh-search');runSearch();setTimeout(()=>$('#q').focus(),60)});
$('#q').addEventListener('input',runSearch);
$('#open-cv').addEventListener('click',()=>{openSheet('sh-cv');setTimeout(()=>$('#cv-krw').focus(),50)});


/* ================= ticket wallet (IndexedDB, this phone only) ================= */
const TCATS=['機票','膠囊列車','海岸列車','X the SKY','釜山 Pass','其他'];
let tcat=TCATS[0];
const tdb=()=>new Promise((res,rej)=>{const r=indexedDB.open('busan-tix',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(mode,fn)=>{const db=await tdb();return new Promise((res,rej)=>{const t=db.transaction('t',mode);const st=t.objectStore('t');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})};
const urls=[];
async function paintTix(){
  const g=$('#tgrid');urls.splice(0).forEach(u=>URL.revokeObjectURL(u));
  let list=[];try{list=await tx('readonly',st=>st.getAll())}catch(e){g.innerHTML='<div class="empty">這個瀏覽器不能存檔案，請改用 Chrome 或 Safari 一般模式</div>';return}
  list.sort((a,b)=>TCATS.indexOf(a.cat)-TCATS.indexOf(b.cat)||a.t-b.t);
  g.innerHTML=list.length?list.map(x=>{const u=URL.createObjectURL(x.blob);urls.push(u);return `<button type="button" data-id="${x.id}"><img src="${u}" alt=""><span>${esc(x.cat)}</span></button>`}).join(''):'<div class="empty">還沒有票券，點上面的按鈕從相簿加入</div>';
  g._list=list;
}
function openTix(cat){if(cat&&TCATS.includes(cat))tcat=cat;$('#tcats').innerHTML=TCATS.map(c=>`<button type="button" aria-pressed="${c===tcat}">${c}</button>`).join('');openSheet('sh-tix');paintTix()}
$('#tcats').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tcat=b.textContent;$('#tcats').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
$('#tfile').addEventListener('change',async e=>{
  const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
  try{await tx('readwrite',st=>{fs.forEach((f,i)=>st.put({id:Date.now()+'-'+i,cat:tcat,blob:f,t:Date.now()+i}))});toast(`已加入 ${fs.length} 張`)}catch(err){toast('加入失敗，空間可能不足')}
  paintTix();
});
let tvId=null;
$('#tgrid').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const x=$('#tgrid')._list.find(t=>t.id===b.dataset.id);tvId=x.id;$('#tv-img').src=b.querySelector('img').src;$('#tv-label').textContent=x.cat;const d=$('#tv-del');d.classList.remove('arm');d.textContent='刪除';$('#sh-tview').hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>$('#sh-tview').classList.add('show')))});
$('#tv-del').addEventListener('click',async e=>{const d=e.currentTarget;if(!d.classList.contains('arm')){d.classList.add('arm');d.textContent='再按一次確認刪除';return}
  await tx('readwrite',st=>st.delete(tvId));const v=$('#sh-tview');v.classList.remove('show');setTimeout(()=>v.hidden=true,250);paintTix();toast('已刪除')});
document.addEventListener('click',e=>{const b=e.target.closest('.tixbtn');if(b)openTix(b.dataset.cat)});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* converter */
const rateEl=$('#cv-rate'),krwEl=$('#cv-krw'),twdEl=$('#cv-twd');
rateEl.value=store.get('rate','0.0213');
const num=v=>parseFloat(String(v).replace(/[^\d.]/g,''))||0;
const fmtK=n=>n?Math.round(n).toLocaleString('en-US'):'';
const fmtT=n=>n?(n>=100?Math.round(n).toLocaleString('en-US'):n.toFixed(1)):'';
function fromK(){const k=num(krwEl.value);krwEl.value=fmtK(k);twdEl.value=fmtT(k*num(rateEl.value))}
function fromT(){const t=num(twdEl.value);krwEl.value=fmtK(t/num(rateEl.value))}
krwEl.addEventListener('input',fromK);twdEl.addEventListener('input',fromT);
rateEl.addEventListener('input',()=>{store.set('rate',rateEl.value);fromK()});
$('#cv-chips').innerHTML=[1000,5000,10000,30000,50000].map(v=>`<button type="button" data-v="${v}">₩${v.toLocaleString('en-US')}</button>`).join('');
$('#cv-chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;krwEl.value=b.dataset.v;fromK()});

/* naver checklist */
document.querySelectorAll('.nvck').forEach(cb=>{cb.checked=store.get(cb.dataset.k,'0')==='1';cb.addEventListener('change',()=>{store.set(cb.dataset.k,cb.checked?'1':'0');paintNvCount()})});paintNvCount();
/* checklists + display switches */
document.querySelectorAll('.check input').forEach(cb=>{cb.checked=store.get('ck-'+cb.dataset.k,'0')==='1';cb.addEventListener('change',()=>store.set('ck-'+cb.dataset.k,cb.checked?'1':'0'))});
[['photos','sw-photos'],['maps','sw-maps']].forEach(([k,id])=>{
  const el=$('#'+id);const on=store.get('show-'+k,'1')!=='0';el.checked=on;document.body.classList.toggle('no-'+k,!on);
  el.addEventListener('change',()=>{store.set('show-'+k,el.checked?'1':'0');document.body.classList.toggle('no-'+k,!el.checked)});
});
$('#reset-done').addEventListener('click',()=>{days.forEach(d=>d.stops.forEach((s,i)=>store.set(doneKey(d.id,i),'0')));document.querySelectorAll('.stop.is-done').forEach(li=>{li.classList.remove('is-done');li.querySelector('.chk').setAttribute('aria-pressed','false')});updateNext();toast('已清除')});

/* start */
loadWx();
updateNext();
const today=days.find(d=>d.date===todayStr());
let start='info';const hash=location.hash.slice(1);
if(all.some(t=>t.id===hash)) start=hash; else if(today) start=today.id; else {const s=store.get('tab','info');if(all.some(t=>t.id===s))start=s}
show(start,false);
setInterval(updateNext,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){renderTabs();show(current,false);updateNext()}});

/* offline */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

</script>
