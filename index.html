<style>
/* Layout: one-column phone companion — sticky day tabs, timeline of stops, every place ends in a big 導航 button */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#1c2a33; --muted:#5f707b; --line:#dde5ea;
  --sea:#1f5f8b; --sea-soft:#e3eef6; --pink:#d4537e; --pink-soft:#fbe8ef;
  --move:#b35f12; --move-soft:#fdf0e1; --ok:#2f7d4f;
  --f-display:"LXGW WenKai TC","Noto Serif TC",serif;
  --f-body:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171d; --surface:#17222a; --ink:#e4ecf1; --muted:#93a4ae; --line:#2a3943;
  --sea:#7fb6dc; --sea-soft:#1c3142; --pink:#f08cb0; --pink-soft:#3a1f2b;
  --move:#f0a85a; --move-soft:#3a2a17; --ok:#6fc293; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171d; --surface:#17222a; --ink:#e4ecf1; --muted:#93a4ae; --line:#2a3943;
  --sea:#7fb6dc; --sea-soft:#1c3142; --pink:#f08cb0; --pink-soft:#3a1f2b;
  --move:#f0a85a; --move-soft:#3a2a17; --ok:#6fc293; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea)}
a{color:var(--sea)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{background:var(--sea);color:#fff;padding-block:22px 18px}
header.hero h1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;line-height:1.2;margin:0;text-wrap:balance}
header.hero p{margin:4px 0 0;opacity:.9;font-size:.92rem}
.hero .flight{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .flight span{background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-size:.82rem;font-family:var(--f-mono)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
nav.tabs button small{font-size:.7rem;font-family:var(--f-mono)}
nav.tabs button[aria-selected="true"]{background:var(--sea);color:#fff}
nav.tabs button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
main{padding-block:16px 48px}
section[hidden]{display:none}
h2{font-family:var(--f-display);font-size:1.45rem;margin:4px 0 2px;text-wrap:balance}
h3{font-size:1rem;margin:22px 0 8px;color:var(--muted);letter-spacing:.04em}
.lead{color:var(--muted);margin:0 0 12px;font-size:.9rem}
.stay{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--sea-soft);border-radius:10px;padding:10px 12px;margin:10px 0 14px;font-size:.9rem}
.flow{font-size:.88rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:52px;top:8px;bottom:8px;width:2px;background:var(--line)}
.stop{display:grid;grid-template-columns:44px 1fr;gap:16px;padding-block:10px;position:relative}
.stop .time{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);text-align:right;padding-top:3px;font-variant-numeric:tabular-nums}
.stop::after{content:"";position:absolute;left:48px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--sea)}
.stop.food::after{border-color:var(--pink)}
.stop.move::after{border-color:var(--move)}
.body{min-width:0}
.kind{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;padding:1px 7px;border-radius:4px;margin-bottom:3px;background:var(--sea-soft);color:var(--sea)}
.food .kind{background:var(--pink-soft);color:var(--pink)}
.move .kind{background:var(--move-soft);color:var(--move)}
.title{font-weight:700;font-size:1.05rem;line-height:1.35}
.sub{color:var(--muted);font-size:.88rem;margin-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.nav{display:inline-flex;align-items:center;gap:6px;background:var(--sea);color:#fff;text-decoration:none;font-weight:700;font-size:.92rem;padding:9px 16px;border-radius:10px;min-height:42px}
.food .nav{background:var(--pink)}
.ghost{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:.85rem;padding:8px 12px;border-radius:10px;min-height:42px}
.nav svg,.ghost svg{width:16px;height:16px;flex:0 0 auto}
.tip{margin-top:8px;font-size:.85rem;background:var(--move-soft);border-radius:8px;padding:8px 10px;color:var(--ink)}
.tip b{color:var(--move)}
.warn{margin-top:8px;font-size:.85rem;border-left:3px solid var(--pink);padding:2px 10px;color:var(--ink)}
.alts{margin-top:10px;display:grid;gap:8px}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.alt .an{font-weight:600}
.alt .an small{font-weight:400;color:var(--muted);margin-left:6px}
.alt .btns{margin-top:6px}
.alt .nav,.alt .ghost{min-height:36px;padding:6px 12px;font-size:.84rem}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card .title{font-size:1rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.8rem}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.links a{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.9rem;min-width:0}
.check{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--ok);flex:0 0 auto;margin-top:1px}
.check input:checked+span{text-decoration:line-through;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--muted)}
details[open] summary::after{content:"－"}
details .inner{padding:0 14px 12px}
.place{padding:10px 0;border-top:1px solid var(--line)}
.place:first-child{border-top:0}
.place .meta{font-size:.84rem;color:var(--muted)}
.place .btns{margin-top:6px}
.place .nav,.place .ghost{min-height:36px;padding:6px 12px;font-size:.84rem}
code{font-family:var(--f-mono);background:var(--sea-soft);padding:0 5px;border-radius:4px}
.today{display:inline-block;background:var(--pink);color:#fff;font-size:.7rem;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
@media (prefers-reduced-motion:no-preference){.nav,.ghost{transition:transform .1s}.nav:active,.ghost:active{transform:scale(.97)}}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.mapimg{display:block;width:100%;aspect-ratio:16/10;max-width:100%;border:0;border-radius:12px;margin-top:10px;background:var(--sea-soft)}
.alt .mapimg{aspect-ratio:16/9;margin-top:8px}
.showmap{font:inherit;cursor:pointer}

.photos{display:grid;gap:6px;margin-top:10px}
.photos.two{grid-template-columns:1fr 1fr}
.photos img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--sea-soft);max-width:100%}
.photos:not(.two) img{aspect-ratio:16/10}
.credit{font-size:.7rem;color:var(--muted);margin-top:3px}

.toggles{display:flex;align-items:center;gap:8px;padding-block:10px 0;font-size:.85rem;color:var(--muted)}
.toggles button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
.toggles button[aria-pressed="true"]{background:var(--sea-soft);color:var(--sea);border-color:transparent;font-weight:700}
.toggles button[aria-pressed="true"]::before{content:"✓ "}
body.no-photos .photos,body.no-photos .credit{display:none}
body.no-maps .mapimg,body.no-maps .showmap{display:none}

nav.tabs button em{font-style:normal;font-size:.68rem;font-weight:700;letter-spacing:.02em;opacity:.85;white-space:nowrap}
.eyebrow{display:inline-block;font-size:.78rem;font-weight:700;color:var(--pink);background:var(--pink-soft);border-radius:999px;padding:2px 10px;margin-bottom:4px}

.body.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start}
.sd summary{list-style:none;cursor:pointer;position:relative;padding-right:22px}
.sd summary::-webkit-details-marker{display:none}
.sd summary::after{content:"";position:absolute;right:4px;top:8px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.sd[open] summary::after{transform:rotate(-135deg);top:12px}
.sd summary:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:6px}
.sdc{padding-bottom:4px}
.badge{display:inline-block;font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px}
.qnav{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:52px;min-height:48px;padding:6px 8px;border-radius:12px;background:var(--sea);color:#fff;text-decoration:none;font-size:.72rem;font-weight:700}
.food .qnav{background:var(--pink)}
.qnav svg{width:18px;height:18px}
.expall{display:flex;gap:8px;justify-content:flex-end;margin:4px 0 2px}
.expall button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 12px;cursor:pointer}
</style>
</head>

}

const kindLabel={move:'交通',food:'吃',sight:'景點',stay:'住宿',note:'提醒'};

function renderDay(d){
  let h=`<div class="eyebrow">${d.area}</div><h2>${d.tab}｜${d.h}</h2><p class="lead">${d.d}</p>`;
  h+=`<div class="stay"><span>🛏 ${esc(d.stay[0])}</span>${d.stay[1].nav?`<a class="nav" href="${navUrl(d.stay[1].nav)}" target="_blank" rel="noopener">${ic.nav}回飯店</a>`:''}</div>`;
  h+=`<div class="flow">${esc(d.flow)}</div><div class="expall"><button type="button" class="exp" data-open="1">全部展開</button><button type="button" class="exp" data-open="0">全部收合</button></div><ol class="timeline">`;
  for(const s of d.stops){
    const k=s.k==='stay'||s.k==='note'?'sight':s.k;
    let c='';
    c+=photoHtml(s.title);
    if(s.nav) c+=mapImg(s.nav);
    c+=buttons(s);
    if(s.alts){c+='<div class="alts">';for(const a of s.alts){c+=`<div class="alt"><div class="an">${esc(a.n)}${a.s?`<small>${esc(a.s)}</small>`:''}</div>${photoHtml(a.n)}${a.nav?mapImg(a.nav):''}${buttons(a)}</div>`}c+='</div>'}
    if(s.tip) c+=`<div class="tip">${s.tip}</div>`;
    if(s.warn) c+=`<div class="warn">⚠️ ${esc(s.warn)}</div>`;
    const badge=[s.alts?`${s.alts.length} 個選擇`:'',s.warn?'⚠️ 注意':''].filter(Boolean).map(b=>`<span class="badge">${b}</span>`).join('');
    const head=`<span class="kind">${kindLabel[s.k]}</span>${badge}<div class="title">${esc(s.title)}</div>${s.sub?`<div class="sub">${esc(s.sub)}</div>`:''}`;
    const q=s.nav?`<a class="qnav" href="${navUrl(s.nav)}" target="_blank" rel="noopener" aria-label="導航到${esc(s.title)}">${ic.nav}<span>導航</span></a>`:'';
    h+=`<li class="stop ${k}"><div class="time">${esc(s.t)}</div><div class="body row">`;
    h+=c?`<details class="sd"><summary>${head}</summary><div class="sdc">${c}</div></details>`:`<div class="sd plain">${head}</div>`;
    h+=q+'</div></li>';
  }
  h+='</ol>';
  if(d.note) h+=`<div class="note"><b>提醒</b><br>${d.note}</div>`;
  return h;
}

function placeList(arr){

}
function checklist(id,items){
  return `<ul class="check">${items.map((t,i)=>`<li><label><input type="checkbox" id="${id}-${i}" data-k="${id}-${i}"><span>${t}</span></label></li>`).join('')}</ul>`;
}

/* ---------- tabs ---------- */
const tabsEl=document.getElementById('tabs'), mainEl=document.getElementById('main');
const all=[{id:'info',area:'出發前',tab:'行前',d:'資訊'},...days.map(d=>({id:d.id,area:d.area,tab:d.tab,d:d.d.split(' ')[0]}))];
const now=new Date(); const todayStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const todayDay=days.find(d=>d.date===todayStr);
let html='';
html+=`<section id="sec-info" role="tabpanel">${renderInfo()}</section>`;
for(const d of days) html+=`<section id="sec-${d.id}" role="tabpanel" hidden>${renderDay(d)}</section>`;
mainEl.innerHTML=html;
tabsEl.innerHTML=all.map(t=>`<button role="tab" id="tab-${t.id}" data-id="${t.id}" aria-selected="false"><em>${t.area}</em>${t.tab}${todayDay&&todayDay.id===t.id?'<span class="today">今天</span>':''}<small>${t.d}</small></button>`).join('');
function show(id,scroll){
  for(const t of all){
    document.getElementById('sec-'+t.id).hidden=t.id!==id;
    document.getElementById('tab-'+t.id).setAttribute('aria-selected',t.id===id);
  }
  try{localStorage.setItem('busan-tab',id)}catch(e){}
  if(scroll) window.scrollTo({top:document.querySelector('header.hero').offsetHeight,behavior:'auto'});
  document.getElementById('tab-'+id).scrollIntoView({block:'nearest',inline:'nearest'});
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b){show(b.dataset.id,true);try{history.replaceState(null,'','#'+b.dataset.id)}catch(err){}}});
let start='info';
const hash=location.hash.slice(1);
if(all.some(t=>t.id===hash)) start=hash;
else if(todayDay) start=todayDay.id;
else {try{const s=localStorage.getItem('busan-tab');if(s&&all.some(t=>t.id===s))start=s}catch(e){}}
show(start,false);

document.addEventListener('click',e=>{const b=e.target.closest('.showmap');if(!b)return;b.insertAdjacentHTML('afterend',mapImg(b.dataset.q));b.remove();});

/* show/hide photos & maps, remembered on this phone */
[['photos','tgl-photos'],['maps','tgl-maps']].forEach(([k,id])=>{
  const b=document.getElementById(id);
  const apply=on=>{document.body.classList.toggle('no-'+k,!on);b.setAttribute('aria-pressed',on)};
  let on=true;try{on=localStorage.getItem('busan-show-'+k)!=='0'}catch(e){}
  apply(on);
  b.addEventListener('click',()=>{on=!on;apply(on);try{localStorage.setItem('busan-show-'+k,on?'1':'0')}catch(e){}});
});
document.addEventListener('click',e=>{const b=e.target.closest('.exp');if(!b)return;const sec=b.closest('section');sec.querySelectorAll('details.sd').forEach(d=>d.open=b.dataset.open==='1');});
/* checkboxes remembered on this phone */
document.querySelectorAll('.check input').forEach(cb=>{
  try{cb.checked=localStorage.getItem('busan-'+cb.dataset.k)==='1'}catch(e){}
  cb.addEventListener('change',()=>{try{localStorage.setItem('busan-'+cb.dataset.k,cb.checked?'1':'0')}catch(e){}});
});
